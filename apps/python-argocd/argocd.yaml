apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: python-argocd
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/nishank841/Helm-charts
    targetRevision: main
    path: charts/base-app
    helm:
      valueFiles:
        - ../../apps/python-argocd/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: python-argocd-ns-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
