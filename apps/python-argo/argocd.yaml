apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ values.name }}
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/nishank841/Helm-charts
    targetRevision: main
    path: charts/base-app
    helm:
      valueFiles:
        - ../../apps/{{ values.name }}-values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ values.name }}-ns-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
